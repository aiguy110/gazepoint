[project]
name = "gazepoint"
version = "0.0.1"
description = "Hold a key and the cursor jumps to where you're looking (webcam gaze + head refinement)."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  # mediapipe depends on opencv-contrib-python; pin the same flavor so we never
  # end up with two packages fighting over cv2.
  "opencv-contrib-python>=4.9",
  "mediapipe>=0.10.14,<2",
  "onnxruntime>=1.18",
  "evdev-binary>=1.7",
  "python-xlib>=0.33",
  "jeepney>=0.8",
]

[project.scripts]
gazepoint = "gazepoint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# uv's managed CPython bundles tkinter (the collect UI); distro Pythons often don't.
python-preference = "only-managed"
